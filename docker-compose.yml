x-common-restart: &common-restart
  restart: unless-stopped

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    <<: *common-restart
    env_file: .env
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./config/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      # Enable the lifecycle API so the pipeline can POST /-/reload to pick up
      # config changes WITHOUT a restart (zero scrape gap). Safe here: nothing is
      # publicly exposed (access is SSH-tunnel only, no public port on 9090).
      - '--web.enable-lifecycle'
      # Accept remote_write from the in-cluster prometheus-agent. A NodePort
      # scrape is load-balanced across the backing pods, so it hits one random
      # pod per interval (serrated, useless aggregation) — the reason the webhook
      # scrape was retired. Instead an agent INSIDE the cluster discovers every
      # pod (kubernetes_sd) and remote_writes the per-pod series here, so
      # sum()/max() over pods is exact. This is the standing ingest path for
      # cluster-side metrics (app metrics today; cAdvisor + kube-state-metrics
      # next — see docs/cluster-metrics-logs-study.md). Storage, dashboards and
      # alerting stay OUTSIDE the cluster, which is the whole point.
      - '--web.enable-remote-write-receiver'
      # Bound the TSDB. Retention is time-based by default (15d) with NO size
      # cap, so growth is driven by series count — and cAdvisor is about to add
      # per-container series that scale with pod count (a burn hits 100+ pods).
      # This droplet is 80GB shared with Loki, Grafana and the OS, so give the
      # TSDB an explicit ceiling: whichever limit is reached first wins, and the
      # disk cannot fill silently. Raise it deliberately if we ever need a longer
      # window; the DiskAlmostFull alert is the backstop, not the plan.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=20GB'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *common-restart
    env_file: .env
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    ports:
      - "9093:9093"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.0.5
    <<: *common-restart
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    # NO published port. Grafana is reachable ONLY from inside this compose
    # network, and the only thing that reaches it from outside is the cloudflared
    # container below. This is not cosmetic: auth.proxy (see .env.example) makes
    # Grafana trust an identity header, so anything able to talk to :3000
    # directly could forge that header and log in as anyone. Removing the port is
    # what makes trusting the header safe.
    #
    # For admin access without Cloudflare, tunnel over SSH:
    #   ssh -L 3000:grafana:3000 <user>@<droplet>   (see docs/access.md)
    expose:
      - "3000"
    depends_on:
      - prometheus
      - alertmanager
    networks:
      - monitoring


  # cloudflared: the only door into Grafana.
  #
  # It makes an OUTBOUND connection to Cloudflare and serves the tunnel over it,
  # so the droplet needs no inbound port open for this to work — there is nothing
  # to port-scan. Cloudflare Access sits in front and authenticates every request
  # (corporate SSO + MFA) before it is ever forwarded here, then passes the user's
  # email in a header that Grafana consumes to provision the account.
  #
  # Adding or removing a developer is a change to the Access policy — no Grafana
  # user administration, no shared password, no binary to rebuild and redistribute.
  cloudflared:
    image: cloudflare/cloudflared:2024.8.3
    <<: *common-restart
    env_file: .env
    command: tunnel --no-autoupdate run
    networks:
      monitoring:
        # Fixed address so Grafana's auth.proxy whitelist can name it. On the
        # default bridge network container IPs move between restarts, which would
        # make the whitelist either wrong or uselessly wide.
        ipv4_address: 172.28.0.10
    depends_on:
      - grafana

  node-exporter:
    image: prom/node-exporter:v1.7.0
    <<: *common-restart
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)'
    networks:
      - monitoring

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.0
    <<: *common-restart
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - promtail_positions:/var/lib/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  promtail_positions:

# One explicit network with a fixed subnet, so cloudflared can hold a stable
# address for Grafana's auth.proxy whitelist. Compose's default network assigns
# addresses dynamically, which would leave the whitelist either stale after a
# restart or widened to the whole subnet — and a wide whitelist on auth.proxy
# means any container here could forge the identity header.
networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
