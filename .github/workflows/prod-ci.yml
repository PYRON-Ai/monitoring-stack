name: Prod CI & PR

# The PRODUCTION validation gate, mirroring pyron-doks-iac/prod-ci.yml. Staging
# and prod have DIFFERENT tfvars/backend/firewall, so code that passed the
# staging checks (feature-ci on feature→stage) must be RE-VALIDATED against the
# prod config before it can merge to main.
#
# Runs on PRs targeting main: docker compose config + terraform fmt/validate,
# then a `terraform plan` with prod.tfvars against the real prod backend. Prod
# state is empty until the first apply, so the plan shows everything as "will be
# created" — the true shape of what prod will become. The plan is commented on
# the PR so reviewers see the actual prod blast radius before merging.
#
# This NEVER applies — it only plans and comments. The apply is deploy-prod's
# job (manual dispatch, "type DEPLOY"). "Merging to main deploys nothing."

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main

jobs:
  ci-check:
    name: Prod checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3

      - name: Populate placeholder env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Validate docker compose
        run: docker compose config

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  plan:
    name: Terraform plan (production)
    needs: ci-check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      # PROD credentials — separate scoped DO token; Spaces creds shared (state
      # isolated by key path: production/... vs staging/...). Same secret names
      # this repo already uses (_PRODUCTION), not doks's _PROD.
      TF_VAR_do_token:          ${{ secrets.DO_TOKEN_PRODUCTION }}
      TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_FINGERPRINT_PRODUCTION }}
      AWS_ACCESS_KEY_ID:        ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:    ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_spaces_access_id:  ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Plan against the PROD backend + prod.tfvars. Prod state is empty until
      # first apply, so this shows the full "will be created" shape. -lock=false:
      # a plan does not need the state lock and must not contend with anything.
      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config="key=production/terraform.tfstate"

      - name: Terraform plan (prod)
        id: plan
        working-directory: terraform
        run: |
          set -o pipefail
          terraform plan -var-file=prod.tfvars -input=false -no-color -lock=false \
            | tee plan.txt
        continue-on-error: true

      - name: Comment prod plan on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const MAX = 60000;
            if (plan.length > MAX) {
              plan = plan.slice(plan.length - MAX);
              plan = '...(truncated — see the Actions log for the full plan)\n' + plan;
            }
            const status = '${{ steps.plan.outcome }}';
            const icon = status === 'success' ? '✅' : '⚠️';
            const body = [
              `### ${icon} Terraform plan — PRODUCTION (\`${status}\`)`,
              '',
              '> ⚠️ This is the PRODUCTION plan (prod.tfvars, prod backend). Review the',
              '> blast radius carefully — prod state is empty until first apply, so a',
              '> fresh prod shows everything as "will be created".',
              '',
              '```hcl',
              plan,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: |
          echo "prod terraform plan failed — see the comment / log above."
          exit 1
