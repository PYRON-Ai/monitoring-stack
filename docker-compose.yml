x-common-restart: &common-restart
  restart: unless-stopped

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    <<: *common-restart
    env_file: .env
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./config/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      # Enable the lifecycle API so the pipeline can POST /-/reload to pick up
      # config changes WITHOUT a restart (zero scrape gap). Safe here: nothing is
      # publicly exposed (access is SSH-tunnel only, no public port on 9090).
      - '--web.enable-lifecycle'
      # Accept remote_write from the in-cluster prometheus-agent. A NodePort
      # scrape is load-balanced across the backing pods, so it hits one random
      # pod per interval (serrated, useless aggregation) — the reason the webhook
      # scrape was retired. Instead an agent INSIDE the cluster discovers every
      # pod (kubernetes_sd) and remote_writes the per-pod series here, so
      # sum()/max() over pods is exact. This is the standing ingest path for
      # cluster-side metrics (app metrics today; cAdvisor + kube-state-metrics
      # next — see docs/cluster-metrics-logs-study.md). Storage, dashboards and
      # alerting stay OUTSIDE the cluster, which is the whole point.
      - '--web.enable-remote-write-receiver'
      # Bound the TSDB. Retention is time-based by default (15d) with NO size
      # cap, so growth is driven by series count — and cAdvisor is about to add
      # per-container series that scale with pod count (a burn hits 100+ pods).
      # This droplet is 80GB shared with Loki, Grafana and the OS, so give the
      # TSDB an explicit ceiling: whichever limit is reached first wins, and the
      # disk cannot fill silently. Raise it deliberately if we ever need a longer
      # window; the DiskAlmostFull alert is the backstop, not the plan.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=20GB'
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *common-restart
    env_file: .env
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:10.0.5
    <<: *common-restart
    env_file: .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - alertmanager

  node-exporter:
    image: prom/node-exporter:v1.7.0
    <<: *common-restart
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)'

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"


  promtail:
    image: grafana/promtail:2.9.0
    <<: *common-restart
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - promtail_positions:/var/lib/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  promtail_positions:
