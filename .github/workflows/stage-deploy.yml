name: Stage Deploy

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - stage

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      droplet_ip: ${{ steps.tf_outputs.outputs.droplet_ip }}

    env:
      # Terraform vars — agora todas mapeadas corretamente 🔥
      TF_VAR_do_token:             ${{ secrets.DO_TOKEN_STAGING }}
      TF_VAR_spaces_access_id:     ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_key:    ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_key_fingerprint:  ${{ secrets.DO_SSH_FINGERPRINT_STAGING }}

      # opcional → caso teu Terraform use AWS_* para Spaces SDK
      AWS_ACCESS_KEY_ID:           ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:       ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=stage.tfvars -auto-approve -input=false

      - name: Capture outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: infra
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ needs.infra.outputs.droplet_ip }}
      DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER_STAGING }}
      DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH_STAGING }}
      MONITOR_ENV: ${{ secrets.MONITOR_ENV_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Sync stack
        run: |
          rsync -avzh --delete --exclude '.git' --exclude '.env' ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}

      - name: Push env
        if: env.MONITOR_ENV != ''
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          printf '%s\n' "${{ env.MONITOR_ENV }}" > "${{ env.DEPLOY_PATH }}/.env"
          chmod 600 "${{ env.DEPLOY_PATH }}/.env"
          EOF

      - name: Deploy stack
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          cd ${{ env.DEPLOY_PATH }}
          docker compose pull
          docker compose up -d --remove-orphans
          EOF

  create-pr:
    name: Create PR to main
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ github.ref }}
          title: "[Auto] Merge ${{ github.ref_name }} into main"
          body: "Auto-created PR after successful CI checks."
          draft: false
          delete-branch: false
