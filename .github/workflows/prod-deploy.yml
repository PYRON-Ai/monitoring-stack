name: Production Deploy

on:
  push:
    branches:
      - main

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      droplet_ip: ${{ steps.tf_outputs.outputs.droplet_ip }}
    env:
      TF_VAR_environment: production
      TF_VAR_do_token: ${{ secrets.DO_TOKEN_PRODUCTION }}
      TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_FINGERPRINT_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Select production workspace
        working-directory: terraform
        run: terraform workspace select production || terraform workspace new production

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=prod.tfvars -auto-approve -input=false

      - name: Capture outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: infra
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ needs.infra.outputs.droplet_ip }}
      DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER_PRODUCTION }}
      DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH_PRODUCTION }}
      MONITOR_ENV: ${{ secrets.MONITOR_ENV_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Sync stack
        run: |
          rsync -avzh --delete --exclude '.git' --exclude '.env' ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}

      - name: Push env
        if: env.MONITOR_ENV != ''
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          printf '%s\n' "${{ env.MONITOR_ENV }}" > "${{ env.DEPLOY_PATH }}/.env"
          chmod 600 "${{ env.DEPLOY_PATH }}/.env"
          EOF

      - name: Deploy stack
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          cd ${{ env.DEPLOY_PATH }}
          docker compose pull
          docker compose up -d --remove-orphans
          EOF

