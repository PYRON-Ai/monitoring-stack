auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

ingester:
  wal:
    enabled: false
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
  chunk_idle_period: 5m
  chunk_retain_period: 30s

schema_config:
  configs:
    - from: 2020-10-15
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  enforce_metric_name: false
  # How far back a query may reach. Replaces chunk_store_config's
  # max_look_back_period, which Loki 2.9 warns is deprecated. Kept in step with
  # the retention below: querying further back than we keep data returns nothing
  # useful and only costs index scans.
  max_query_lookback: 168h

# 7 days (168h). Logs measured at ~221MB for 48h of a mostly idle cluster, so a
# week costs well under a gigabyte against ~70GB free. The earlier 48h was chosen
# when everything lived on a smaller footprint and predates the cluster shipping
# its logs here; a week means a Friday incident is still readable on Monday,
# which 48h does not cover.
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h
