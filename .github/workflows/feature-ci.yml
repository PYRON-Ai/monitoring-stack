name: Feature CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - stage

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Populate placeholder env
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Validate docker compose
        run: docker compose config

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Run terraform fmt check
        working-directory: terraform
        run: terraform fmt -check

  create-pr:
    name: Create PR to stage
    needs: ci-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const base = 'stage';
            const head = process.env.HEAD_BRANCH;
            const { owner, repo } = github.context.repo;
            try {
              await github.rest.repos.getBranch({ owner, repo, branch: base });
            } catch (error) {
              console.log(`Base branch ${base} missing—skip PR creation.`);
              return;
            }
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              base,
              head: `${owner}:${head}`,
              state: 'open',
            });
            if (existing.data.length > 0) {
              console.log('PR already exists');
              return;
            }
            await github.rest.pulls.create({
              owner,
              repo,
              title: `[Auto] Merge ${head} into stage`,
              head,
              base,
              body: 'Auto-created PR after successful CI checks.',
            });

