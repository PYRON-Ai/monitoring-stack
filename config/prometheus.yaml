global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yaml"
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance_name: "prometheus-server"

  - job_name: 'Monitoring'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_name: "monitor-server"

  - job_name: 'digitalocean'
    static_configs:
      - targets: ['digitalocean-exporter:9212']
        labels:
          instance_name: "digitalocean"

  - job_name: "Frontend"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.4:9100"]
        labels:
          instance_name: "frontend-server"

  - job_name: "Webhook"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.2:9100"]
        labels:
          instance_name: "webhook-server"

  - job_name: "Backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.3:9100"]
        labels:
          instance_name: "backend-server"

  - job_name: "Ingestor-Server"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.7:9100"]
        labels:
          instance_name: "ingestor-server"

  - job_name: "Ingestor-Metrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.7:8000"]
        labels:
          instance_name: "ingestor-metrics"
