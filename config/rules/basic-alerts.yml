groups:
  - name: basic-alerts
    rules:

      # --- NODE EXPORTER DOWN ---
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is DOWN"
          description: "Prometheus cannot scrape metrics from the node-exporter job for 1 minute."

      # --- HIGH CPU ---
      - alert: HighCPUUsage
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage has been above 85% for at least 2 minutes."

      # --- HIGH MEMORY ---
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90% for at least 2 minutes."

      # --- DISK ALMOST FULL ---
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} 
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage above 90%"
          description: "The disk is above 90% usage."

      # --- HIGH LOAD AVERAGE ---
      - alert: HighLoadAverage
        expr: node_load1 > count(node_cpu_seconds_total{mode="idle"}) * 1.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Load average too high"
          description: "The 1-minute load average is 150% of CPU count."

      # --- INSTANCE DOWN (genérico para qualquer alvo) ---
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance is DOWN"
          description: "Prometheus cannot scrape this target for 1 minute."
