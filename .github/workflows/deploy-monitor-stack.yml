name: Deploy Monitor Stack

on:
  push:
    branches:
      - main
      - stage
      - 'feature/**'
  pull_request:
    branches:
      - stage

jobs:
  ci-check:
    name: Validate feature branches and PRs
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/'))
      || (github.event_name == 'pull_request' && github.base_ref == 'stage')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Validate docker compose
        run: docker compose config

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run terraform fmt check
        working-directory: terraform
        run: terraform fmt -check

  infra-staging:
    name: Provision staging infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stage'
    outputs:
      droplet_ip: ${{ steps.tf_outputs.outputs.droplet_ip }}
      spaces_bucket_name: ${{ steps.tf_outputs.outputs.spaces_bucket_name }}
      spaces_bucket_region: ${{ steps.tf_outputs.outputs.spaces_bucket_region }}
    env:
      TF_VAR_environment: staging
      TF_VAR_do_token: ${{ secrets.DO_TOKEN_STAGING }}
      TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_FINGERPRINT_STAGING }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.8

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Select staging workspace
        working-directory: terraform
        run: terraform workspace select staging || terraform workspace new staging

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=stage.tfvars -auto-approve -input=false

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"
          echo "spaces_bucket_name=$(terraform output -raw spaces_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "spaces_bucket_region=$(terraform output -raw spaces_bucket_region)" >> "$GITHUB_OUTPUT"

  infra-production:
    name: Provision production infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      droplet_ip: ${{ steps.tf_outputs.outputs.droplet_ip }}
      spaces_bucket_name: ${{ steps.tf_outputs.outputs.spaces_bucket_name }}
      spaces_bucket_region: ${{ steps.tf_outputs.outputs.spaces_bucket_region }}
    env:
      TF_VAR_environment: production
      TF_VAR_do_token: ${{ secrets.DO_TOKEN_PRODUCTION }}
      TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_FINGERPRINT_PRODUCTION }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Select production workspace
        working-directory: terraform
        run: terraform workspace select production || terraform workspace new production

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=prod.tfvars -auto-approve -input=false

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"
          echo "spaces_bucket_name=$(terraform output -raw spaces_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "spaces_bucket_region=$(terraform output -raw spaces_bucket_region)" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    needs: infra-staging
    if: needs.infra-staging.outputs.droplet_ip != ''
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ needs.infra-staging.outputs.droplet_ip }}
      DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER_STAGING }}
      DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH_STAGING }}
      MONITOR_ENV: ${{ secrets.MONITOR_ENV_STAGING }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Sync stack to staging droplet
        run: |
          rsync -avzh --delete --exclude '.git' --exclude '.env' ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}

      - name: Push staging environment file
        if: env.MONITOR_ENV != ''
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          printf '%s\n' "${{ env.MONITOR_ENV }}" > "${{ env.DEPLOY_PATH }}/.env"
          chmod 600 "${{ env.DEPLOY_PATH }}/.env"
          EOF

      - name: Deploy monitor stack to staging
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          cd ${{ env.DEPLOY_PATH }}
          docker compose pull
          docker compose up -d --remove-orphans
          EOF

  deploy-production:
    name: Deploy to production
    needs: infra-production
    if: needs.infra-production.outputs.droplet_ip != ''
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ needs.infra-production.outputs.droplet_ip }}
      DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER_PRODUCTION }}
      DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH_PRODUCTION }}
      MONITOR_ENV: ${{ secrets.MONITOR_ENV_PRODUCTION }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Sync stack to production droplet
        run: |
          rsync -avzh --delete --exclude '.git' --exclude '.env' ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}

      - name: Push production environment file
        if: env.MONITOR_ENV != ''
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          printf '%s\n' "${{ env.MONITOR_ENV }}" > "${{ env.DEPLOY_PATH }}/.env"
          chmod 600 "${{ env.DEPLOY_PATH }}/.env"
          EOF

      - name: Deploy monitor stack to production
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          cd ${{ env.DEPLOY_PATH }}
          docker compose pull
          docker compose up -d --remove-orphans
          EOF

