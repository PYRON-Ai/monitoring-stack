name: Stage Deploy

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - stage

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      droplet_ip: ${{ steps.tf_outputs.outputs.droplet_ip }}
    env:
      TF_VAR_environment: staging
      TF_VAR_do_token: ${{ secrets.DO_TOKEN_STAGING }}
      TF_VAR_ssh_key_fingerprint: ${{ secrets.DO_SSH_FINGERPRINT_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Select staging workspace
        working-directory: terraform
        run: terraform workspace select staging || terraform workspace new staging

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=stage.tfvars -auto-approve -input=false

      - name: Capture outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: infra
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ needs.infra.outputs.droplet_ip }}
      DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER_STAGING }}
      DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH_STAGING }}
      MONITOR_ENV: ${{ secrets.MONITOR_ENV_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Sync stack
        run: |
          rsync -avzh --delete --exclude '.git' --exclude '.env' ./ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}

      - name: Push env
        if: env.MONITOR_ENV != ''
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          printf '%s\n' "${{ env.MONITOR_ENV }}" > "${{ env.DEPLOY_PATH }}/.env"
          chmod 600 "${{ env.DEPLOY_PATH }}/.env"
          EOF

      - name: Deploy stack
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<'EOF'
          cd ${{ env.DEPLOY_PATH }}
          docker compose pull
          docker compose up -d --remove-orphans
          EOF

  create-pr:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PR to main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stage
          base: main
          title: "[Auto] Promote stage to main"
          body: "Stage deploy completed successfully."
          draft: false

