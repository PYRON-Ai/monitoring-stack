name: Deploy Stack

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - stage

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      droplet_ip: ${{ steps.tf_outputs.outputs.droplet_ip }}
      destroy_flag: ${{ steps.tf_outputs.outputs.destroy_flag }}

    env:
      TF_VAR_do_token:             ${{ secrets.DO_TOKEN_STAGING }}
      TF_VAR_spaces_access_id:     ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_key:    ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_key_fingerprint:  ${{ secrets.DO_SSH_FINGERPRINT_STAGING }}

      AWS_ACCESS_KEY_ID:           ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:       ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=stage.tfvars -auto-approve -input=false

      - name: Capture outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          # Extrai o IP igual antes
          RAW=$(terraform output droplet_ip)
          IP=$(echo "$RAW" | grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n 1)
          echo "droplet_ip=$IP" >> "$GITHUB_OUTPUT"

          # Extrai destroy flag do tfvars
          DESTROY=$(grep -E '^destroy *= *' stage.tfvars | awk '{print $3}' | tr -d '"')
          echo "destroy_flag=$DESTROY" >> "$GITHUB_OUTPUT"

  bootstrap:
    needs: infra
    if: needs.infra.outputs.destroy_flag != 'true'
    runs-on: ubuntu-latest

    env:
      HOST: ${{ needs.infra.outputs.droplet_ip }}
      USER: ${{ secrets.DO_DEPLOY_USER_STAGING }}

    steps:
      - uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Add host fingerprint
        run: ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Provision droplet — instala Docker + deps
        run: |
          ssh $USER@$HOST <<EOF
            set -eux

            # remove o arquivo quebrado
            rm -f /etc/apt/sources.list.d/docker.list

            # espera qualquer apt que ainda esteja processando
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
              echo "🔒 APT ocupado — aguardando 5s..."
              sleep 5
            done

            apt-get update -y
            apt-get install -y ca-certificates curl gnupg lsb-release

            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg

            # recria a source, agora expande $(...)
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
            | tee /etc/apt/sources.list.d/docker.list

            apt-get update -y
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

            systemctl enable docker --now
          EOF

  destroy:
    needs: infra
    if: needs.infra.outputs.destroy_flag == 'true'
    runs-on: ubuntu-latest

    env:
      DESTROY: ${{ needs.infra.outputs.destroy_flag }}
      TF_VAR_do_token:             ${{ secrets.DO_TOKEN_STAGING }}
      TF_VAR_spaces_access_id:     ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_key:    ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_key_fingerprint:  ${{ secrets.DO_SSH_FINGERPRINT_STAGING }}
      AWS_ACCESS_KEY_ID:           ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:       ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform init (backend + state lock)
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Destroy ⚠ IRREVERSÍVEL
        working-directory: terraform
        run: |
          echo "⚠ EXECUTANDO DEATH PROTOCOL — SEM VOLTA ⚠"
          terraform destroy -var-file=stage.tfvars -auto-approve


  deploy:
    needs: [infra, bootstrap]
    if: needs.infra.outputs.destroy_flag != 'true'
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ needs.infra.outputs.droplet_ip }}
      DEPLOY_USER: ${{ secrets.DO_DEPLOY_USER_STAGING }}
      DEPLOY_PATH: ${{ secrets.DO_DEPLOY_PATH_STAGING }}
      MONITOR_ENV: ${{ secrets.MONITOR_ENV_STAGING }}

    steps:
      - uses: actions/checkout@v4

      - name: Load SSH KEY
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_SSH_KEY }}

      - name: Add host fingerprint
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH
        run: ssh -o BatchMode=yes $DEPLOY_USER@$DEPLOY_HOST "echo 🔥 Connected!"

      - name: Sync stack (idempotente, rápido, cirúrgico)
        run: |
          set -e
          rsync -avzh --delete --exclude '.git' --exclude '.env' ./ \
            $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH

      - name: Push environment
        if: env.MONITOR_ENV != ''
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST <<EOF
          echo "${MONITOR_ENV}" > ${DEPLOY_PATH}/.env
          chmod 600 ${DEPLOY_PATH}/.env
          EOF

      - name: Bootstrap Loki volumes (directories fix)
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST <<EOF
            set -eux
            cd $DEPLOY_PATH

            # Garante que os volumes existem
            docker volume create loki_data || true
            docker volume create loki_wal || true

            echo "📦 Preparing Loki directory structure..."

            docker run --rm -v loki_data:/loki alpine sh -c "\
              mkdir -p /loki && \
              mkdir -p /loki/index && \
              mkdir -p /loki/cache && \
              mkdir -p /loki/chunks && \
              mkdir -p /loki/compactor && \
              mkdir -p /loki/boltdb-shipper-compactor \
            "

            docker run --rm -v loki_wal:/wal alpine sh -c "\
              mkdir -p /wal \
            "

            echo "📁 Loki volume bootstrap completed."
          EOF

      - name: Deploy + Restart Stack
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST <<EOF
          cd $DEPLOY_PATH
          docker compose pull
          docker compose up -d --remove-orphans
          EOF

      - name: Stack report final
        run: |
          ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} <<EOF
            cd ${{ env.DEPLOY_PATH }}
            echo "🔥 Services:"
            docker compose ps
            echo "─────────────────────────────────────────────"
            echo "📜 Lastest Logs:"
            docker compose logs --tail=50
            echo "─────────────────────────────────────────────"
            echo "🟢 Deployed!"
          EOF

