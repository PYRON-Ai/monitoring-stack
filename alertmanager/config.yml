global:
  resolve_timeout: 2m

route:
  receiver: telegram
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram
    - matchers:
        - severity="warning"
      receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "Markdown"
        message: >
          {{ if eq .Status "firing" -}}
          🚨 *Alert: {{ .CommonLabels.alertname }}*\n
          Severity: *{{ .CommonLabels.severity }}*\n\n'

          *{{ .CommonAnnotations.summary }}*\n
          {{ .CommonAnnotations.description }}\n\n

          Instance: {{ .CommonLabels.instance }}
          {{- else -}}
          ✅ *Resolved: {{ .CommonLabels.alertname }}*\n\n

          {{ .CommonAnnotations.summary }}\n\n
          Instance: {{ .CommonLabels.instance }}
          {{- end }}

