global:
  resolve_timeout: 2m

route:
  receiver: telegram
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram
    - matchers:
        - severity="warning"
      receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "Markdown"
        message: |
          {{ if eq .Status "firing" -}}
          🚨 *Alert: {{ .CommonLabels.alertname }}*  
          *Severity:* {{ .CommonLabels.severity }}  

          *{{ .CommonAnnotations.summary }}*  
          {{ .CommonAnnotations.description }}  

          *Instance:* {{ or .CommonLabels.job .CommonLabels.instance }}

          {{- else -}}
          ✅ *Resolved: {{ .CommonLabels.alertname }}*  

          {{ .CommonAnnotations.summary }}  

          *Instance:* {{ or .CommonLabels.job .CommonLabels.instance }}
          {{- end }}

