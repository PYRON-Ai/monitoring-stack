global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yaml"
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance_name: "prometheus-server"

  - job_name: 'Monitoring'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_name: "monitor-server"

  # NOTE: the digitalocean-exporter was removed — the project is dead (last
  # release 2020) and has no DOKS collector, so it never saw the cluster (only
  # droplet/LB inventory, which doctl/the DO panel already show).
  #
  # The old per-droplet node-exporter jobs (frontend/webhook/backend at 10.1.0.x)
  # were also removed — those droplets were retired in the k8s migration.
  #
  # App-level metrics (req/s, latency, queue depth) will come from the services
  # exposing /metrics (prom-client), scraped via the cluster once instrumented
  # (staging monitoring phase 2). Cluster infra metrics come from metrics-server
  # / the DO panel for now.
