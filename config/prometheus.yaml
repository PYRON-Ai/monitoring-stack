global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mongodb'
    metrics_path: /metrics
    static_configs:
      - targets: ['mongodb_exporter:9216']

  - job_name: 'app'
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['app:3001']
