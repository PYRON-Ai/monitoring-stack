global:
  resolve_timeout: 2m

route:
  receiver: telegram
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram
    - matchers:
        - severity="warning"
      receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "Markdown"
