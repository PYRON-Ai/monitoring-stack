global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yaml"
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance_name: "prometheus-server"

  - job_name: 'Monitoring'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_name: "monitor-server"

  # ── DOKS cluster: ingress-nginx metrics ──────────────────────────────────
  # The ingress controller sees ALL app traffic, so its metrics give request
  # rate, latency (p50/p95/p99) and status codes PER service — WITHOUT
  # instrumenting the apps. Enabled in doks-iac (controller.metrics.enabled=true)
  # and exposed as NodePort 30254. We scrape it at the cluster's system node
  # private IP over the shared VPC (the monitoring droplet is 10.0.0.2, the node
  # is 10.0.0.4 — same VPC pyron-vpc-staging). NodePort answers on every node;
  # 10.0.0.4 is the fixed min-pool system node, a stable target for staging.
  - job_name: 'ingress-nginx'
    metrics_path: /metrics
    static_configs:
      - targets: ['10.0.0.4:30254']
        labels:
          instance_name: "doks-ingress"
          cluster: "pyron-doks-staging"

  # ── Webhook app metrics (prom-client) ────────────────────────────────────
  # The webhook exposes /metrics on a dedicated port (9090), surfaced as
  # NodePort 30902 by the webhook-metrics Service (k8s-ephemeral). This gives
  # what the ingress can't see: BullMQ queue depth, per-agent backlog,
  # rules_compiled, and Node runtime (CPU/RAM/event-loop). Scraped over the VPC
  # at the system node IP, same bridge as the ingress. (Ephemeral test env.)
  - job_name: 'webhook-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['10.0.0.4:30902']
        labels:
          instance_name: "webhook-ephemeral"
          cluster: "pyron-doks-staging"

  # NOTE: the digitalocean-exporter was removed (dead since 2020, no DOKS
  # collector) and the old per-droplet node-exporter jobs (10.1.0.x) too — those
  # droplets were retired in the k8s migration.
  #
  # Deeper app-level metrics (BullMQ queue depth, rules-compiled, per-agent) come
  # later via prom-client in the services (phase 2). The ingress already gives
  # the request-rate/latency "graph over time". Cluster CPU/RAM: metrics-server /
  # DO panel for now.
