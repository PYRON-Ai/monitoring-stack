# PRODUCTION alertmanager config — Telegram paging for critical alerts.
#
# This is the prod counterpart of config.stage.yml (null receiver). The deploy
# copies the per-environment file onto config.yml on the droplet; config.yml
# itself is a deploy artifact, not source (see .gitignore). Stage never sees
# this file, prod never sees the null one.
#
# CHAT_ID IS AN INTEGER, NOT A STRING. Alertmanager v0.27.0 types
# TelegramConfig.ChatID as a Go int64 (config/notifiers.go), so `chat_id` must
# be a bare YAML integer — a quoted value fails the boot parse with
# "cannot unmarshal !!str into int64" and Alertmanager refuses to start. That is
# why the chat_id is a literal here and is deliberately NOT fed through envsubst
# or any other string-producing substitution. It is also why only the bot token
# (a real secret, and a string) is injected, via bot_token_file below.
#
# BOT TOKEN comes from a file the deploy writes from the TELEGRAM_BOT_TOKEN
# secret (mode 0600, gitignored), never from this file and never from the repo.
# bot_token_file is mutually exclusive with bot_token — only the file is set.

global:
  resolve_timeout: 2m

route:
  # Default receiver. Everything that isn't matched by a route below lands here.
  # Warnings go here FOR NOW (null) — warning paging is a separate, deliberate
  # pass we'll tune later. Only critical pages today.
  receiver: "null"
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical → Telegram. Grouped and throttled so a burst of related criticals
    # (e.g. several pods of one deployment) arrives as a few messages, not a flood.
    - matchers:
        - severity="critical"
      receiver: "telegram-critical"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
    # Warning → null for now. This is the slot where the tuned warning route
    # will go (its own receiver, quieter throttle). Left explicit so the
    # intent is visible and the change is a one-liner later.
    - matchers:
        - severity="warning"
      receiver: "null"

receivers:
  - name: "null"

  # ── Shared Telegram message template ──────────────────────────────────────
  # One layout for every Telegram receiver, so aprimorar it means editing ONE
  # place. The &tg_message YAML anchor below is reused (*tg_message) by each
  # receiver; only the status glyph changes, which the template derives from the
  # alert's own severity label — so critical and warning share the same block.
  #
  # The default message dumps every label (uid, job, the beta_kubernetes_io_*
  # noise) plus a raw Prometheus /graph URL — unreadable on a phone. This keeps
  # only what matters in an incident: a status line (color by severity), the
  # human summary, where it is (ns/pod/container), and the description. Grouped
  # alerts render one block each. HTML parse_mode, so only <b>/<i>/<code>/<a>
  # are allowed; our summaries/descriptions are plain text, so no escaping here.

  - name: "telegram-critical"
    telegram_configs:
      - bot_token_file: /etc/alertmanager/bot_token
        # chat_id is a BARE INTEGER, never quoted and never substituted:
        # Alertmanager types it as a Go int64, so a quoted value fails the boot
        # parse ("cannot unmarshal !!str into int64") and a zero value fails
        # validation ("missing chat_id"). The id alone grants nothing without the
        # bot token (which stays out of the repo), so it lives here as a literal.
        #
        # This is a SUPERGROUP ("Pyron-AI Monitoring"), so the id has the -100
        # prefix Telegram gives supergroups/channels — NOT the bare number and
        # not a plain negative. A wrong form authenticates fine but fails delivery
        # with "chat not found (400)". The authoritative value came from
        # api.telegram.org/bot<TOKEN>/getUpdates (the chat the bot actually sees).
        chat_id: -1003317516855
        parse_mode: HTML
        send_resolved: true
        message: &tg_message |-
          {{ if eq .Status "resolved" }}✅ <b>RESOLVED</b>{{ else if eq .CommonLabels.severity "critical" }}🔴 <b>FIRING</b>{{ else }}🟡 <b>FIRING</b>{{ end }} · <b>{{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          📦 <code>{{ .Labels.namespace }}/{{ .Labels.pod }}</code>{{ if .Labels.container }} ({{ .Labels.container }}){{ end }}
          {{ if .Labels.severity }}⚠️ <i>{{ .Labels.severity }}</i>{{ end }}
          {{ if .Annotations.description }}📝 {{ .Annotations.description }}{{ end }}
          {{ end }}

  # Warning receiver — SAME layout (reuses *tg_message), ready for when the tuned
  # warning route is turned on. Currently nothing routes here (the warning route
  # still points at "null"); this exists so the template and chat are defined in
  # one consistent place. The 🟡 glyph is picked automatically by severity.
  - name: "telegram-warning"
    telegram_configs:
      - bot_token_file: /etc/alertmanager/bot_token
        chat_id: -1003317516855
        parse_mode: HTML
        send_resolved: true
        message: *tg_message
