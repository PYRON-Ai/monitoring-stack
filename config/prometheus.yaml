global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yaml"
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'Monitoring'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'digitalocean'
    static_configs:
      - targets: ['digitalocean-exporter:9212']

  - job_name: "Frontend"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.4:9100"]

  - job_name: "Webhook"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.2:9100"]

  - job_name: "Backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.0.3:9100"]
