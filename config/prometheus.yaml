global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mongodb'
    metrics_path: /metrics
    static_configs:
      - targets: ['mongodb_exporter:9216']

  - job_name: 'app'
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['app:3001']
      
groups:
  - name: pyron-alerts
    rules:
      - alert: HighCPU
        expr: (avg(rate(node_cpu_seconds_total{mode!="idle"}[2m]))*100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU Alta"
          description: "CPU acima de 85% por 2+ minutos"

      - alert: HighMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Memória Crítica"
          description: "Menos de 15% de RAM disponível"

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disco quase cheio"
          description: "Raiz abaixo de 10% disponível"

      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servidor OFFLINE"
          description: "Node não responde há +1m"
