global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yaml"
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance_name: "prometheus-server"

  - job_name: 'Monitoring'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_name: "monitor-server"

  # ── DOKS cluster metrics: RETIRED from this file ─────────────────────────
  # An 'ingress-nginx' job used to scrape NodePort 30254 at the cluster's system
  # node (10.0.0.4) over the VPC. It is gone, for the same reason the webhook job
  # before it is gone: a NodePort scrape is a single static target pointed at one
  # node, so it breaks the moment that node is replaced — which is exactly what
  # happened. It sat DOWN for weeks, firing InstanceDown continuously, while the
  # ingress itself was perfectly healthy the whole time.
  #
  # Ingress metrics arrive by remote_write instead, from the in-cluster agent
  # that discovers the controller through kubernetes_sd (verified: the series
  # carry a POD address, 10.105.x:10254, not the NodePort). Nothing was lost by
  # removing this job — it had contributed nothing since the node changed.
  #
  # The rule stands: no NodePort scrape jobs in this file. Anything in the
  # cluster is collected by the agent there and pushed here.

  # ── Webhook app metrics: RETIRED from this file ──────────────────────────
  # There was a 'webhook-app' job here scraping NodePort 30902. It is gone for
  # good, not parked: a NodePort scrape is load-balanced by kube-proxy across the
  # backing pods, so it samples ONE RANDOM POD per interval. At 100+ webhook pods
  # the BullMQ queue-depth/backlog series came out serrated and un-aggregatable.
  #
  # That is a property of NodePort + multiple replicas, not of the webhook, so
  # re-enabling it at low pod counts would just re-arm the same trap. App metrics
  # arrive by remote_write instead, from an in-cluster prometheus-agent that
  # discovers every pod via kubernetes_sd (docker-compose sets
  # --web.enable-remote-write-receiver for this). The agent is being promoted
  # from burn-ephemeral to a permanent Deployment, and will carry cAdvisor and
  # kube-state-metrics on the same path — see docs/cluster-metrics-logs-study.md.
  #
  # Rule of thumb going forward: no new NodePort scrape jobs in this file.

  # NOTE: the digitalocean-exporter was removed (dead since 2020, no DOKS
  # collector) and the old per-droplet node-exporter jobs (10.1.0.x) too — those
  # droplets were retired in the k8s migration.
  #
  # Deeper app-level metrics (BullMQ queue depth, rules-compiled, per-agent) come
  # later via prom-client in the services (phase 2). The ingress already gives
  # the request-rate/latency "graph over time". Cluster CPU/RAM per pod arrives
  # with cAdvisor + kube-state-metrics via the permanent agent (study, step 2);
  # until then it's metrics-server / the DO panel.
