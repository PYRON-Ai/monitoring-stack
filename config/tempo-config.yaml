server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    jaeger:
      protocols:
        grpc: {}
        thrift_http: {}
        thrift_binary: {}
        thrift_compact: {}
    otlp:
      protocols:
        grpc: {}
        http: {}

ingester:
  num_tokens: 512
  max_traces_per_user: 100000

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
  index:
    backend: boltdb
    boltdb:
      directory: /var/tempo/index

compactor:
  compaction:
    block_size: 2h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 7d

