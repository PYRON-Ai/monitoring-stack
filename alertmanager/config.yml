global:
  resolve_timeout: 5m

route:
  receiver: 'telegram'
  repeat_interval: 30m

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: "${TG_BOT_TOKEN}"
        chat_id: "${TG_CHAT_ID}"
        parse_mode: HTML
        message: |
          🚨 ALERT — PYRON INFRA
          DROPLET: {{ $labels.droplet }}
          ALERT: {{ $labels.alertname }}
          VALUE: {{ $value }}
          TIME: {{ humanizeDuration $duration }}

  - alert: HighCPU
    expr: (do_droplet_cpu_mean > 80)
    for: 5m
    labels: { severity: "critical" }
    annotations:
      description: "CPU > 80%"

  - alert: HighMemory
    expr: (do_droplet_memory_available_percent < 15)
    for: 5m
    labels: { severity: "warning" }
    annotations:
      description: "Memory < 15%"

